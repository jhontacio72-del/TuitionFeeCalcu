        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Instrument+Serif:ital@0;1&display=swap');
        :root {
          color-scheme: light;
          --bg: #eef5fb;
          --surface: #ffffff;
          --surface-2: #e5eff9;
          --text: #18324b;
          --muted: #667d93;
          --line: #d2e0ed;
          --green: #2878d0;
          --green-dark: #1558a6;
          --lime: #c5e2ff;
          --orange: #ef9c4b;
          --blue: #7a62d3;
          --shadow: 0 12px 35px #15372b18;
        }
        * { box-sizing: border-box; }
        body { margin:0; }
        .app-root {
          min-height: 100vh;
          background: var(--bg);
          color: var(--text);
          font-family: Inter, ui-sans-serif, system-ui, sans-serif;
          padding: 14px clamp(10px, 2.2vw, 28px) 18px;
        }
        .workspace {
          max-width: 1440px;
          margin: auto;
          display: grid;
          grid-template-columns: minmax(300px, 340px) minmax(0, 1fr);
          gap: 12px;
          align-items: stretch;
        }
        .panel {
          background: var(--surface);
          border: 1px solid var(--line);
          border-radius: 22px;
          box-shadow: var(--shadow);
          overflow: hidden;
        }
        .sidebar { padding: 22px; display:flex; flex-direction:column; }
        .section-title { font-weight: 850; font-size: 1rem; margin: 0 0 14px; letter-spacing:-.02em; font-family: Inter; }
        .field-label { display:block; font-size:.72rem; font-weight:800; color:var(--muted); margin:0 0 6px; letter-spacing:.08em; }
        .input-wrap { position:relative; margin-bottom:12px; }
        .input-wrap input {
          width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px;
          padding:13px 42px 13px 14px; color:var(--text); outline:none; font-weight:600; font-size:.92rem;
          transition:.18s;
        }
        .input-wrap input:focus { border-color:var(--green); box-shadow:0 0 0 3px #2878d020; }
        .field-icon { position:absolute; right:14px; top:12px; color:var(--muted); font-size:1rem; }
        .suggestions {
          position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:20;
          background:rgba(255,255,255,0.92); backdrop-filter: blur(16px);
          border:1px solid var(--line); border-radius:14px; box-shadow:0 12px 32px #1232;
          max-height:240px; overflow:auto; padding:6px;
        }
        .suggestion { display:block; width:100%; border:0; background:transparent; color:var(--text); text-align:left; padding:11px 12px; border-radius:10px; font-size:.88rem; font-weight:600; cursor:pointer; }
        .suggestion:hover { background:var(--surface-2); }
        .suggestion b { color:var(--green); }
        .swap { display:flex; align-items:center; justify-content:flex-end; margin:-4px 0 10px; }
        .swap button { border:0; background:var(--surface-2); color:var(--green); border-radius:9px; width:32px;height:32px;font-size:1.05rem; cursor:pointer; }
        .quick-label { font-size:.74rem; color:var(--muted); font-weight:750; margin:16px 0 8px; letter-spacing:.06em; text-transform:uppercase; }
        .quick-places { display:flex; gap:7px; flex-wrap:wrap; }
        .quick-place { border:1px solid var(--line); border-radius:11px; padding:8px 11px; background:var(--surface); color:var(--text); font-size:.78rem; font-weight:700; cursor:pointer; transition:.15s; }
        .quick-place:hover { border-color:var(--green); color:var(--green); background:#eaf4ff; }
        .divider { height:1px; background:var(--line); margin:18px 0; }
        .mode-list { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
        .mode { min-width:0; border:1px solid var(--line); background:var(--surface); border-radius:13px; padding:11px 5px 10px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:7px; font-size:.76rem; font-weight:750; cursor:pointer; transition:.18s; }
        .mode .mode-icon { font-size:1.25rem; }
        .mode.active { color:var(--green); border-color:var(--green); background:#eaf4ff; box-shadow:inset 0 0 0 1px var(--green); }
        .toggle-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:12px 0; }
        .toggle-copy { display:flex; flex-direction:column; gap:2px; }
        .toggle-copy strong { font-size:.84rem; }
        .switch { width:43px;height:25px; border:0; border-radius:999px; padding:3px; background:#c4d5e5; flex-shrink:0; transition:.2s; cursor:pointer; position:relative; }
        .switch::after { content:""; display:block; width:19px;height:19px;background:white;border-radius:50%;transition:.2s;box-shadow:0 1px 3px #0002; }
        .switch[aria-checked="true"] { background:var(--green); }
        .switch[aria-checked="true"]::after { transform:translateX(18px); }
        .find-btn { width:100%; border:0; border-radius:13px; padding:14px; background:var(--green); color:white; font-weight:850; margin-top:auto; box-shadow:0 6px 14px #2878d025; cursor:pointer; font-size:.95rem; letter-spacing:-.01em; }
        .find-btn:hover { background:var(--green-dark); }
        .map-panel { height: min(92vh, 1080px); min-height: 760px; position:relative; background:#dbe9f7; isolation:isolate; overflow:hidden; border-radius:22px; }
        #leafletMap { width:100%; height:100%; min-height:760px; display:block; z-index:0; }

        .map-chip {
          background: rgba(255,255,255,0.86);
